<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const langBtn = document.getElementById("toggle-lang");
let isEnglish = true;
const rate = 150;

function updatePrices() {
  document.querySelectorAll(".product-price").forEach(el => {
    const usd = parseFloat(el.getAttribute("data-usd"));
    el.textContent = isEnglish
      ? `$${usd.toFixed(2)}`
      : `¥${(usd * rate).toLocaleString()}`;
  });
}

function updateProductNames() {
  document.querySelectorAll(".product-name").forEach(el => {
    el.textContent = isEnglish
      ? el.getAttribute("data-name-en")
      : el.getAttribute("data-name-ja");
  });
}

langBtn.addEventListener("click", () => {
  isEnglish = !isEnglish;

  document.querySelector(".nav-home").textContent = isEnglish ? "HOME" : "ホーム";
  document.querySelector(".nav-shop").textContent = isEnglish ? "SHOP" : "ショップ";
  document.querySelector(".nav-about").textContent = isEnglish ? "ABOUT" : "アバウト";
  document.querySelector(".nav-contact").textContent = isEnglish ? "CONTACT" : "コンタクト";

  document.querySelector(".collection-title").textContent =
    isEnglish ? "FRUITBOWL COLLECTION" : "フルーツボウルコレクション";

  langBtn.textContent = isEnglish ? "日本語" : "English";

  updatePrices();
  updateProductNames();
});

updatePrices();
updateProductNames();
</script>
