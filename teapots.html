<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Moon Pottery Shop</title>

  <!-- Google Fonts: Great Vibes -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Main Stylesheet -->
  <link href="scripts/css/main.css" rel="stylesheet">

  <style>
    /* Make product images taller */
    .product img {
      height: 450px; /* Adjust this value as needed */
      width: 500px;
      object-fit: cover; /* Keeps the image aspect ratio */
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <img src="images/logo.jpg" alt="Moon Pottery Logo" class="header-logo">
    Moon Pottery
  </div>
  <nav>
    <a href="index.html" class="nav-home">HOME</a>
    <a href="shop.html" class="nav-shop">SHOP</a>
    <a href="about.html" class="nav-about">ABOUT</a>
    <a href="contact.html" class="nav-contact">CONTACT</a>
    <button class="lang-btn" id="toggle-lang">日本語</button>
  </nav>
</header>

<!-- ====================== Teapot COLLECTION ====================== -->
<section class="section">
  <h2 class="collection-title">TEAPOTS COLLECTION</h2>
  <div class="gallery">

    <a href="b59b60b61.html" class="product-link">
      <div class="product">
        <img src="images/b61.jpeg" alt="Stoneware Jar">
        <h3 class="product-name">Stoneware B3 Teapot Black</h3>
        <p class="product-price" data-usd="40">$40 / ¥6000</p>
      </div>
    </a>

    <a href="b62b63b64b65.html" class="product-link">
      <div class="product">
        <img src="images/b65.jpeg" alt="Porcelain Jar">
        <h3 class="product-name">Stoneware B3 Teapot Grey</h3>
        <p class="product-price" data-usd="40">$40 / ¥6000</p>
      </div>
    </a>

  </div>
</section>

<footer>
  &copy; 2025 MOON POTTERY — ALL RIGHTS RESERVED.
  <div class="footer-links" style="margin-top: 1rem;">
    <a href="about.html">ABOUT</a> |
    <a href="faqs.html">FAQs</a> |
    <a href="contact.html">CONTACT</a> |
    <a href="press.html">PRESS ROOM</a>
  </div>
  <div class="footer-logo">
    <img src="images/logo.jpg" alt="Moon Pottery Logo">
  </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const langBtn = document.getElementById("toggle-lang");
let isEnglish = true;

langBtn.addEventListener("click", () => {
  isEnglish = !isEnglish;

  // Navbar
  document.querySelector(".nav-home").textContent = isEnglish ? "HOME" : "ホーム";
  document.querySelector(".nav-shop").textContent = isEnglish ? "SHOP" : "ショップ";
  document.querySelector(".nav-about").textContent = isEnglish ? "ABOUT" : "アバウト";
  document.querySelector(".nav-contact").textContent = isEnglish ? "CONTACT" : "コンタクト";

  // Section Titles
  document.querySelectorAll(".collection-title").forEach((el, i) => {
    if(i === 0) el.textContent = isEnglish ? "JAR COLLECTION" : "壺コレクション";
    if(i === 1) el.textContent = isEnglish ? "FRUITS BOWL COLLECTION" : "フルーツボウルコレクション";
    if(i === 2) el.textContent = isEnglish ? "COFFEE POUROVER COLLECTION" : "コーヒーポウローバーコレクション";
    if(i === 3) el.textContent = isEnglish ? "KITCHEN COLLECTION" : "キッチンコレクション";
    if(i === 4) el.textContent = isEnglish ? "FEATURED COLLECTION" : "注目コレクション";
  });

  // Product Names
  document.querySelectorAll(".product-name").forEach(el => {
    const eng = el.getAttribute("data-eng") || el.textContent;
    const jpMap = {
      "Stoneware Jar": "ストーンウェア壺",
      "Porcelain Jar": "磁器の壺",
      "Glazed Jar": "釉薬の壺",
      "Clay Jar": "粘土の壺",
      "Mini Jar": "ミニ壺",
      "Fruit Bowl 1": "フルーツボウル 1",
      "Fruit Bowl 2": "フルーツボウル 2",
      "Fruit Bowl 3": "フルーツボウル 3",
      "Fruit Bowl 4": "フルーツボウル 4",
      "Fruit Bowl 5": "フルーツボウル 5",
      "Featured Vase 1": "注目の花瓶 1",
      "Featured Bowl 2": "注目のボウル 2",
      "Featured Cup 3": "注目のカップ 3",
      "Featured Plate 4": "注目のプレート 4",
      "Featured Mug 5": "注目のマグ 5"
    };
    if(isEnglish){
      el.textContent = eng;
    } else {
      el.textContent = jpMap[eng] || eng;
    }
  });

  // Prices (USD/JPY)
  document.querySelectorAll(".product-price").forEach(el => {
    const usd = parseFloat(el.getAttribute("data-usd"));
    el.textContent = isEnglish ? `$${usd} / ¥${usd*150}` : `¥${usd*150} / $${usd}`;
  });

  langBtn.textContent = isEnglish ? "日本語" : "English";
});
</script>

</body>
</html>
