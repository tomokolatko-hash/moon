<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart — Moon Pottery</title>

  <!-- Google Fonts: Great Vibes -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Main Stylesheet -->
  <link href="scripts/css/main.css" rel="stylesheet">

  
</head>
<body>

<header>
  <div class="brand">
    <img src="images/logo.jpg" alt="Moon Pottery Logo" class="header-logo">
    Moon Pottery
  </div>
  <nav>
    <a href="index.html" class="nav-home">HOME</a>
    <a href="shop.html" class="nav-shop">SHOP</a>
    <a href="about.html" class="nav-about">ABOUT</a>
    <a href="contact.html" class="nav-contact">CONTACT</a>
    <button class="lang-btn" id="toggle-lang">日本語</button>
    <button class="btn btn-dark" id="cart-btn" style="margin-left: 1rem;">
      Cart (<span id="cart-count">0</span>)
    </button>
  </nav>
</header>

<section class="section">
  <h2>Your Cart</h2>
  <div id="cart-items"></div>

  <div class="total-section">
    Total: $<span id="cart-total">0</span>
  </div>

  <!-- PayPal Button -->
  <div id="paypal-button-container" style="margin-top: 2rem;"></div>
</section>

<footer>
  &copy; 2025 MOON POTTERY — ALL RIGHTS RESERVED.
  <div class="footer-links" style="margin-top: 1rem;">
    <a href="about.html">ABOUT</a> |
    <a href="faqs.html">FAQs</a> |
    <a href="contact.html">CONTACT</a> |
    <a href="press.html">PRESS ROOM</a>
  </div>
  <div class="footer-logo">
    <img src="images/logo.jpg" alt="Moon Pottery Logo">
  </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- PayPal SDK -->
<script src="https://www.paypal.com/sdk/js?client-id=sb&currency=USD"></script>

<script>
  // --- Load cart from localStorage ---
  let cart = [];
  try {
    const stored = JSON.parse(localStorage.getItem('cart'));
    if (Array.isArray(stored)) {
      cart = stored.map(item => ({
        id: item.id,
        name: item.name,
        price: Number(item.price) || 0,
        image: item.image || "",
        qty: Number(item.qty) || 0
      }));
    }
  } catch(e) {
    cart = [];
  }

  const cartItemsEl = document.getElementById("cart-items");
  const cartCountEl = document.getElementById("cart-count");
  const cartTotalEl = document.getElementById("cart-total");

  function updateCartDisplay() {
    cartItemsEl.innerHTML = "";
    let total = 0;
    cart.forEach((item, index) => {
      const subtotal = item.price * item.qty;
      total += subtotal;

      const div = document.createElement("div");
      div.className = "cart-item";
      div.innerHTML = `
        <img src="${item.image}" alt="${item.name}">
        <div class="cart-item-details">
          <h4>${item.name}</h4>
          <p>Price: $${item.price}</p>
          <p>Subtotal: $<span class="item-subtotal">${subtotal}</span></p>
        </div>
        <div class="cart-item-qty">
          Qty: <input type="number" min="1" value="${item.qty}" data-index="${index}">
        </div>
        <div class="cart-item-remove" data-index="${index}">&times;</div>
      `;
      cartItemsEl.appendChild(div);
    });

    cartTotalEl.textContent = total.toFixed(2);
    cartCountEl.textContent = cart.reduce((sum, i) => sum + i.qty, 0);

    // Add listeners for quantity changes
    document.querySelectorAll(".cart-item-qty input").forEach(input => {
      input.addEventListener("change", e => {
        const idx = e.target.dataset.index;
        let val = parseInt(e.target.value);
        if (isNaN(val) || val < 1) val = 1;
        cart[idx].qty = val;
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartDisplay();
      });
    });

    // Remove item
    document.querySelectorAll(".cart-item-remove").forEach(btn => {
      btn.addEventListener("click", e => {
        const idx = e.target.dataset.index;
        cart.splice(idx, 1);
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartDisplay();
      });
    });
  }

  updateCartDisplay();

  // PayPal Checkout
  paypal.Buttons({
    createOrder: function(data, actions) {
      const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0).toFixed(2);
      return actions.order.create({
        purchase_units: [{
          amount: { value: total }
        }]
      });
    },
    onApprove: function(data, actions) {
      return actions.order.capture().then(function(details) {
        alert('Transaction completed by ' + details.payer.name.given_name);
        // Clear cart
        cart = [];
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartDisplay();
      });
    }
  }).render('#paypal-button-container');

  // Cart button redirect
  document.getElementById("cart-btn").addEventListener("click", () => {
    location.reload();
  });

  // Language toggle (simple)
  const langBtn = document.getElementById("toggle-lang");
  let isEnglish = true;
  langBtn.addEventListener("click", () => {
    isEnglish = !isEnglish;
    document.querySelector(".nav-home").textContent = isEnglish ? "HOME" : "ホーム";
    document.querySelector(".nav-shop").textContent = isEnglish ? "SHOP" : "ショップ";
    document.querySelector(".nav-about").textContent = isEnglish ? "ABOUT" : "アバウト";
    document.querySelector(".nav-contact").textContent = isEnglish ? "CONTACT" : "コンタクト";
    langBtn.textContent = isEnglish ? "日本語" : "English";
  });

</script>

</body>
</html>
