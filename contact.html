<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Moon Pottery — Contact</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Main Stylesheet -->
  <link href="scripts/css/main.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <div class="brand">
    <img src="images/logo.jpg" alt="Moon Pottery Logo" class="header-logo">
    Moon Pottery
  </div>
  <nav>
    <a href="index.html" class="nav-home" data-en="HOME" data-jp="ホーム">HOME</a>
    <a href="shop.html" class="nav-shop" data-en="SHOP" data-jp="ショップ">SHOP</a>
    <a href="about.html" class="nav-about" data-en="ABOUT" data-jp="紹介">ABOUT</a>
    <a href="contact.html" class="nav-contact" data-en="CONTACT" data-jp="お問い合わせ">CONTACT</a>
    <button class="lang-btn" id="toggle-lang">日本語</button>
  </nav>
</header>

<section class="section">
  <h2 id="contact-title" data-en="Contact Us" data-jp="お問い合わせ">Contact Us</h2>
  
  <div class="contact-info">
    <p id="studio-name">Moon Pottery Studio</p>
    <p id="address">555 San Antonio Rd, Mountain View, CA USA</p>
    <p id="contact-details">Email: moonpotteryceramic@gmail.com | Phone: +1 (555) 123-4567</p>
    <p id="hours">Studio Hours: Mon–Sat 10am–6pm</p>
  </div>

  <form class="contact-form">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" placeholder="Your Name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="Your Email" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="5" placeholder="Write your message..." required></textarea>

    <div style="text-align:center; margin-top:1rem;">
      <button type="submit">Send Message</button>
    </div>
  </form>

  <div class="map-container">
    <iframe 
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3169.681429701604!2d-122.11173952465107!3d37.40487573476691!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808fb79b142f89e7%3A0xc75a516ddf3ac36f!2s555%20San%20Antonio%20Rd%2C%20Mountain%20View%2C%20CA%2094040%2C%20USA!5e0!3m2!1sen!2sus!4v1731430000000!5m2!1sen!2sus" 
      width="100%" 
      height="400" 
      style="border:0;" 
      allowfullscreen="" 
      loading="lazy" 
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>

  <div class="contact-image">
    <img src="images/c33.jpeg" alt="Moon Pottery Studio">
  </div>
</section>

<footer>
  &copy; 2025 MOON POTTERY — ALL RIGHTS RESERVED.
  <div class="footer-links" style="margin-top: 1rem;">
    <a href="about.html">ABOUT</a> |
    <a href="faqs.html">FAQs</a> |
    <a href="contact.html">CONTACT</a> |
    <a href="press.html">PRESS ROOM</a>
  </div>
  <div class="footer-logo">
    <img src="images/logo.jpg" alt="Moon Pottery Logo">
  </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Language Toggle Script -->
<script>
  const langBtn = document.getElementById("toggle-lang");
  let currentLang = "en";
  langBtn.addEventListener("click", () => {
    currentLang = currentLang === "en" ? "jp" : "en";
    document.querySelectorAll("[data-en]").forEach(el => {
      el.textContent = el.getAttribute(`data-${currentLang}`);
    });
    langBtn.textContent = currentLang === "en" ? "日本語" : "English";
  });
</script>

</body>
</html>
